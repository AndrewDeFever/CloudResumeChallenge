name: Deploy Lambda via OIDC

on:
  push:
    branches:
      - main
    paths:
      - 'GeoTracker.py'
      - 'ReadGeoCoords.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042889969210:role/GitHubOIDC-CRC-Backend
          aws-region: us-east-1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests

      - name: Package GeoTracker Lambda
        run: |
          rm -rf build/geotracker
          mkdir -p build/geotracker
          pip install requests --target build/geotracker
          cp GeoTracker.py build/geotracker/
          cd build/geotracker
          zip -r ../../lambda_geoip.zip .

      - name: Package ReadGeoCoords Lambda
        run: |
          rm -rf build/readgeocoords
          mkdir -p build/readgeocoords
          cp ReadGeoCoords.py build/readgeocoords/
          cd build/readgeocoords
          zip -r ../../lambda_ReadGeoCoords.zip .

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name GeoTracker \
            --zip-file fileb://lambda_geoip.zip

          aws lambda update-function-code \
            --function-name ReadGeoCoords \
            --zip-file fileb://lambda_ReadGeoCoords.zip
