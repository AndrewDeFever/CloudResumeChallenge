AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GitHub OIDC deployment roles for Cloud Resume frontend and backend.
  These roles are bootstrap/deployment trust resources and remain outside
  the Cloud Resume application stack.

Parameters:
  GitHubOIDCProviderArn:
    Type: String
    Default: arn:aws:iam::042889969210:oidc-provider/token.actions.githubusercontent.com
    Description: Existing GitHub OIDC provider ARN. Must already exist.

  GitHubRepo:
    Type: String
    Default: AndrewDeFever/CloudResumeChallenge
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

  ProductionBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9_./-]+$'

  ResumeBucketName:
    Type: String
    Default: resume.subrealstudios.com

  ResumeDistributionId:
    Type: String
    Default: E11F2W61OQF97D

  AppStackName:
    Type: String
    Default: CloudResume-App

  CloudFormationExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::042889969210:role/CRC-CFN-Execution

Resources:
  CRCFrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubOIDC-CRC-Frontend
      Description: GitHub main-branch role limited to the Cloud Resume static frontend.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustCloudResumeMainGitHubActions
            Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepo}:ref:refs/heads/${ProductionBranch}'

      Policies:
        - PolicyName: CloudResumeFrontendPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListFrontendBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${ResumeBucketName}'

              - Sid: ReadFrontendBucket
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ResumeBucketName}/*'

              - Sid: PublishFrontendObjects
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${ResumeBucketName}/index.html'
                  - !Sub 'arn:aws:s3:::${ResumeBucketName}/404.html'
                  - !Sub 'arn:aws:s3:::${ResumeBucketName}/styles.css'
                  - !Sub 'arn:aws:s3:::${ResumeBucketName}/vendor/*'

              - Sid: InspectAndInvalidateResumeDistribution
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${ResumeDistributionId}'

  CRCBackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubOIDC-CRC-Backend
      Description: >-
        GitHub main-branch role limited to Cloud Resume Lambda code deployments
        and controlled CloudFormation deployment of the Cloud Resume application stack.

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustCloudResumeMainGitHubActions
            Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepo}:ref:refs/heads/${ProductionBranch}'

      Policies:
        - PolicyName: CloudResumeBackendDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UpdateOnlyGeoFunctions
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                Resource:
                  - !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:function:GeoTracker'
                  - !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:function:ReadGeoCoords'

              - Sid: OperateCloudResumeApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/CRC-*/*'

              - Sid: ValidateCloudResumeTemplates
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                Resource: '*'

              - Sid: PassOnlyCloudResumeExecutionRoleToCloudFormation
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Ref CloudFormationExecutionRoleArn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com

Outputs:
  FrontendRoleArn:
    Value: !GetAtt CRCFrontendDeployRole.Arn
    Description: GitHub Actions role for publishing the Cloud Resume frontend.

  BackendRoleArn:
    Value: !GetAtt CRCBackendDeployRole.Arn
    Description: GitHub Actions role for Cloud Resume Lambda code and application-stack deployments.
